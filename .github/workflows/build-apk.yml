name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Expo Prebuild
        run: npx expo prebuild --platform android

      - name: Build Android Release APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Prepare Unzipped Direct APK
        run: |
          mkdir -p output_apk
          cp android/app/build/outputs/apk/release/*.apk output_apk/tata_clamp_and_angle_selection.apk

      - name: Upload Artifact Zip
        uses: actions/upload-artifact@v4
        with:
          name: tata_clamp_and_angle_selection-apk
          path: output_apk/tata_clamp_and_angle_selection.apk

      - name: Publish Direct APK to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.0
          name: "tata_clamp_and_angle_selection v1.0.0 Direct APK"
          body: "Direct production release APK for tata_clamp_and_angle_selection. Download directly to tablet."
          files: output_apk/tata_clamp_and_angle_selection.apk
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}